name: Scheduled scrape

# No `schedule:` trigger — this is a manual/optional alternative to the
# Railway "scraper" service, which is what actually runs on a schedule.
# It previously had a schedule here without APP_URL/SCRAPE_SECRET repo
# secrets ever being set, so every single scheduled run failed instantly
# (100% failure rate, 16/16 runs) for as long as it was enabled. Re-add a
# `schedule:` block only if you actually want this running instead of (or
# alongside) Railway, and set both secrets first.
on:
  workflow_dispatch: {}

jobs:
  trigger-scrape:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/scrape
        run: |
          if [ -z "${APP_URL}" ] || [ -z "${SCRAPE_SECRET}" ]; then
            echo "Set the APP_URL and SCRAPE_SECRET repo secrets to enable this workflow." >&2
            exit 1
          fi
          curl -sf -X POST "${APP_URL%/}/api/scrape" -H "x-scrape-secret: ${SCRAPE_SECRET}"
        env:
          APP_URL: ${{ secrets.APP_URL }}
          SCRAPE_SECRET: ${{ secrets.SCRAPE_SECRET }}
